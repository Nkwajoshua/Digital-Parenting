name: Bootstrap reproducible build artifacts

on:
  push:
    branches:
      - phase7d-build-reproducibility
    paths:
      - .github/workflows/bootstrap-reproducibility.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase7d-build-reproducibility
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Generate Functions lockfile
        working-directory: functions
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify generated artifacts
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradlew
          test -f gradlew.bat
          test -f functions/package-lock.json
          ./gradlew --version
          npm ci --prefix functions --ignore-scripts

      - name: Commit generated artifacts and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-reproducibility.yml
          git add -f gradle/wrapper/gradle-wrapper.jar
          git add gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat functions/package-lock.json .gitignore
          git commit -m "build: restore deterministic wrapper and Functions lockfile"
          git push origin HEAD:phase7d-build-reproducibility
