name: Bootstrap deterministic test lockfiles

on:
  push:
    branches:
      - phase7d-build-reproducibility
    paths:
      - .github/workflows/bootstrap-test-lockfiles.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase7d-build-reproducibility
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Firestore rules test lockfile
        working-directory: tests/firestore-rules
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate callable integration lockfile
        working-directory: tests/functions-integration
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify deterministic installs
        run: |
          npm ci --prefix tests/firestore-rules --ignore-scripts
          npm ci --prefix tests/functions-integration --ignore-scripts

      - name: Commit generated lockfiles and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-test-lockfiles.yml
          git add tests/firestore-rules/package-lock.json tests/functions-integration/package-lock.json
          git commit -m "build: lock emulator test dependencies"
          git push origin HEAD:phase7d-build-reproducibility
