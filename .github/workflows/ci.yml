name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parent-web:
    name: Parent Dashboard Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parent-dashboard-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parent-dashboard-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase env configuration
        run: npm run check:env

      - name: Build web app
        run: npm run build

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run static syntax check
        run: npm run check

  firestore-rules:
    name: Firestore Authorization Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        run: npm --prefix tests/firestore-rules install --no-audit --no-fund

      - name: Run Firestore emulator authorization suite
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --project demo-digital-parenting-rules
          --only firestore
          "npm --prefix tests/firestore-rules test"

  callable-integration:
    name: Callable Control Plane Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Install callable integration dependencies
        run: npm --prefix tests/functions-integration install --no-audit --no-fund

      - name: Run Auth + Functions + Firestore callable suite
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --project demo-digital-parenting-callables
          --only auth,firestore,functions
          "npm --prefix tests/functions-integration test"

  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Note wrapper limitation
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::gradle-wrapper.jar is not committed. CI will compile with provisioned Gradle 8.5 instead of ./gradlew."
          fi

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
