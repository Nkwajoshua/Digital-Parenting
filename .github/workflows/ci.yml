name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  parent-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent-dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parent-dashboard-web/package-lock.json
      - run: npm install
      - run: npm run check:env
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install
      - run: npm run check

  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle assembleDebug
        run: ./gradlew assembleDebug
