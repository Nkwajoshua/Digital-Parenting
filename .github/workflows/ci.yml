name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parent-web:
    name: Parent Dashboard Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parent-dashboard-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parent-dashboard-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase env configuration
        run: npm run check:env

      - name: Build web app
        run: npm run build

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run static syntax check
        run: npm run check

  firestore-rules:
    name: Firestore Authorization Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules test dependencies
        run: npm --prefix tests/firestore-rules ci --no-audit --no-fund

      - name: Run Firestore emulator authorization suite
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --project demo-digital-parenting-rules
          --only firestore
          "npm --prefix tests/firestore-rules test"

  callable-integration:
    name: Callable Control Plane Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            tests/functions-integration/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Functions dependencies
        run: npm --prefix functions ci --no-audit --no-fund

      - name: Install callable integration dependencies
        run: npm --prefix tests/functions-integration ci --no-audit --no-fund

      - name: Run Auth + Functions + Firestore callable suite
        run: >-
          npx --yes firebase-tools@15.29.0 emulators:exec
          --project demo-digital-parenting-callables
          --only auth,firestore,functions
          "npm --prefix tests/functions-integration test"

  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify committed Gradle wrapper
        run: ./gradlew --version

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Compile Android instrumented test APK
        run: ./gradlew --no-daemon assembleDebugAndroidTest

  android-instrumented-tests:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
